<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SwitchBot アイコン</title>
  <style>
    body { background: #f4f6f5; color: #20332d; font: 14px/1.7 system-ui, sans-serif; padding: 48px; text-align: center; }
    h1 { font-size: 24px; } p { color: #63766e; }
    .canvases { display: flex; align-items: end; justify-content: center; gap: 32px; margin: 32px 0; }
    .canvas-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .label { color: #63766e; font-size: 12px; }
    button { background: #176b5b; color: white; border: 0; border-radius: 10px; padding: 12px 24px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #4b9b87; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>SwitchBot アイコン</h1>
  <p>家とスイッチを組み合わせた、ひとつのマーク。<br>ツールバーとポップアップで、同じデザインを使います。</p>
  <div class="canvases" id="canvases"></div>
  <button id="downloadBtn">全サイズをダウンロード</button>
  <script src="design.js"></script>
  <script src="generate.js"></script>
</body>
</html>
